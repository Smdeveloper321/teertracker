name: Auto-Update Teer Results

on:
  schedule:
    # IST = UTC + 5:30
    # 10:00 UTC = 3:30 PM IST (Shillong Round 1)
    # 10:15 UTC = 3:45 PM IST
    # 10:45 UTC = 4:15 PM IST (Khanapara Round 1)
    # 11:05 UTC = 4:35 PM IST (Shillong Round 2)
    # 11:20 UTC = 4:50 PM IST (Khanapara Round 2)
    # 12:00 UTC = 5:30 PM IST (Evening consolidation)
    - cron: '0,15,35 10 * * 1-6'
    - cron: '5,20,35 11 * * 1-6'
    - cron: '0 12 * * 1-6'
  workflow_dispatch:

jobs:
  update-teer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Teer Results Updater
        run: |
          python updater.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "TeerTracker Bot"
          git config --global user.email "bot@teertracker.vercel.app"
          git add index.html shillong-teer-common-number.html teer-previous-results.html
          git diff --staged --quiet || (git commit -m "Auto-update Teer numbers [skip ci]" && git push)
