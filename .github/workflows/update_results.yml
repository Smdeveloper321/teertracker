name: Auto-Update All Teer Results

on:
  schedule:
    # IST = UTC + 5:30
    # Covers: Morning (10:30-11:30 AM), Bhutan (11:30 AM - 12:30 PM), Juwai (1:30-2:30 PM),
    # Shillong Day (3:30-4:30 PM), Khanapara (4:10-4:45 PM), Night (10:30-11:30 PM)
    # 05:00 to 12:00 UTC and 17:00 to 18:30 UTC, Mon-Sat
    - cron: '0,15,35,50 5,6,7,8,9,10,11,12 * * 1-6'
    - cron: '0,15,35,50 17,18 * * 1-6'
  workflow_dispatch:

jobs:
  update-teer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Multi-Game Teer Results Updater
        run: |
          python updater.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "TeerTracker Bot"
          git config --global user.email "bot@teer-result-today.vercel.app"
          git add index.html khanapara-teer-result.html juwai-teer-result.html bhutan-teer-result.html shillong-morning-teer-result.html shillong-night-teer-result.html shillong-teer-common-number.html teer-previous-results.html
          git diff --staged --quiet || (git commit -m "Auto-update live Teer scores [skip ci]" && git push)
